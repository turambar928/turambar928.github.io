  summary: 五项足球视频理解任务，一次技术盘点。从排行榜里寻找值得尝试的方法。
beyond-the-single-camera:
  artwork: multiview
  label: A different angle
  summary: 更多视角不等于更多有效证据。多视角体育视频中的主动搜索、工具调用与错误恢复。
